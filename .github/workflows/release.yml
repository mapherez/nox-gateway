name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: gateway-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  approval:
    name: Reuse approved source CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci.outputs.source_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require successful CI for the exact source
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice('refs/tags/'.length) : '';
            if (!tag) throw new Error("Release requires a version tag.");
            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.sha, tag });
            core.setOutput('source_sha', approval.sourceSha);
            core.setOutput('ci_run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId} (${approval.sourceSha}); no source checks are repeated.`);

  release:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check-release-version.mjs '${{ github.ref_name }}'
      - name: Refuse an existing GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            for await (const { data } of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            })) {
              if (data.some(release => release.tag_name === context.ref.replace('refs/tags/', ''))) {
                throw new Error('This release already exists; refusing to replace it.');
              }
            }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated Gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/mapherez/nox-gateway:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/mapherez/nox-gateway:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/mapherez/nox-gateway
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Create release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo, tag_name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true, prerelease: context.ref.includes('-'),
            });
