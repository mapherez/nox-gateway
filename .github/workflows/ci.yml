name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway / ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.26.0'
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Format, dependency lock, vet, race tests, build and binary smoke
        run: sh scripts/check.sh
      - name: Cross-compile Linux deployment targets
        if: runner.os == 'Linux' && matrix.go == '1.26.0'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o bin/nox-gateway-linux-amd64 ./cmd/nox-gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -o bin/nox-gateway-linux-arm64 ./cmd/nox-gateway

  backend-integration:
    name: Actual Backend / local pairing and MCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v7.0.1
      - name: Checkout published Backend baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: mapherez/nox-backend
          ref: 4a4b72b4c3a1cfb85c581f42bb3351d8a4880cea # v1.1.1
          path: .integration/nox-backend
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            .integration/nox-backend/backend/go.sum
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build actual Gateway
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/nox-gateway" ./cmd/nox-gateway
      - name: Build actual Backend
        working-directory: .integration/nox-backend/backend
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/nox-backend" ./cmd/nox-backend
      - name: Require automatic pairing, private MCP, restart and invalidation
        env:
          NOX_GATEWAY_TEST_BACKEND_BINARY: ${{ runner.temp }}/nox-backend
          NOX_GATEWAY_TEST_GATEWAY_BINARY: ${{ runner.temp }}/nox-gateway
        run: go test -race -mod=readonly -count=1 -v ./internal/acceptance

  image:
    name: Packaged Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: docker build --build-arg VERSION=ci-validation -t nox-gateway:ci .
      - run: python3 scripts/check-image.py --image nox-gateway:ci --version ci-validation
      - run: docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.dev.yml config --quiet
