name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-gateway-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-gateway-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs

  gateway:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Gateway / ${{ matrix.os }} / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.26.0"
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Format, dependency lock, vet, race tests, build and binary smoke
        run: sh scripts/check.sh
      - name: Cross-compile Linux deployment targets
        if: runner.os == 'Linux' && matrix.go == '1.26.0'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o bin/nox-gateway-linux-amd64 ./cmd/nox-gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=readonly -trimpath -o bin/nox-gateway-linux-arm64 ./cmd/nox-gateway

  backend-integration:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Actual Backend / local pairing and MCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gateway
        uses: actions/checkout@v7.0.1
      - name: Checkout published Backend baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: mapherez/nox-backend
          ref: 4a4b72b4c3a1cfb85c581f42bb3351d8a4880cea # v1.1.1
          path: .integration/nox-backend
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            .integration/nox-backend/backend/go.sum
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build actual Gateway
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/nox-gateway" ./cmd/nox-gateway
      - name: Build actual Backend
        working-directory: .integration/nox-backend/backend
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/nox-backend" ./cmd/nox-backend
      - name: Require automatic pairing, private MCP, restart and invalidation
        env:
          NOX_GATEWAY_TEST_BACKEND_BINARY: ${{ runner.temp }}/nox-backend
          NOX_GATEWAY_TEST_GATEWAY_BINARY: ${{ runner.temp }}/nox-gateway
        run: go test -race -mod=readonly -count=1 -v ./internal/acceptance

  image:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: Packaged Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: docker build --build-arg VERSION=ci-validation -t nox-gateway:ci .
      - run: python3 scripts/check-image.py --image nox-gateway:ci --version ci-validation
      - run: docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.dev.yml config --quiet

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, gateway, backend-integration, image, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
